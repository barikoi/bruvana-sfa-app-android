plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 23
        multiDexEnabled true
        flavorDimensions("default")
        resourceConfigurations += ['en', 'bn']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField(
                "String",
                "ONESIGNAL_APP_ID",
                project.properties["ONESIGNAL_APP_ID"].toString()
        )
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        applicationVariants.all {
                // this method is use to rename your all apk weather
                // it may be signed or unsigned(debug apk)
            variant ->
                variant.outputs.each {
                        // on below line we are setting a
                        // name to our apk as GFG.apk
                    output ->
                        def name = "cnl_staging_debug_" + getDateTime() + ".apk"
                        // on below line we are setting the
                        // outputFile Name to our apk file.
                        output.outputFileName = name
                }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    productFlavors {
        production {
            applicationId "com.barikoi.cnlapp"
            dimension "default"
            versionName "1.2.7.13"
            resValue "string", "app_name", "CNL SFA"
            resValue "string", "url_base", "https://cnl.barikoiretail.com:5623/"

            buildConfigField "String", "TRACE_USER", project.properties["TRACE_USER"] as String
            buildConfigField "String", "TRACE_PASS", project.properties["TRACE_PASS"] as String
            buildConfigField "String", "TRACE_API_KEY", project.properties["BRU_TRACE_API_KEY"] as String

            buildConfigField "String", "TRACE_BASE_URL", project.properties["TRACE_BASE_URL_PROD"] as String

            buildConfigField "String", "url_base", '"https://cnl.barikoiretail.com:5623/"'
            buildConfigField 'String', 'sentryDNS', '"https://adc870f9532d8927d0203a60f35ef9ae@sentry.barikoimaps.dev/14"'
            manifestPlaceholders = [
                    appIcon  : "@mipmap/ic_launcher",
                    sentryDNS: "https://adc870f9532d8927d0203a60f35ef9ae@sentry.barikoimaps.dev/14",
//                    onesignal_app_id               : 'cf8bac16-674e-4f68-b587-63199f1b3053',
//                    onesignal_google_project_number: 'REMOTE'

            ]
