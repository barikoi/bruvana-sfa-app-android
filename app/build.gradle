plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
}

android {
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 23
        multiDexEnabled true
        resourceConfigurations += ['en', 'bn']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField(
                "String",
                "ONESIGNAL_APP_ID",
                project.properties["ONESIGNAL_APP_ID"].toString()
        )
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        applicationVariants.all { variant ->
            variant.outputs.each { output ->
                def flavorName = variant.flavorName ?: "noflavor"
                def buildType = variant.buildType.name
                def dateTime = new Date().format('yyyy-MM-dd_HH-mm-ss')
                def versionName = variant.versionName

                def name = "bruvana_${flavorName}_${buildType}_${dateTime}_${versionName}.apk"
                output.outputFileName = name
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    flavorDimensions += "environment"


    productFlavors {
        production {
            applicationId "com.barikoi.bruvana"
            dimension "environment"
            versionName "1.2.7.11"
            resValue "string", "app_name", "Bruvana SFA"
            resValue "string", "url_base", "https://bruvana.barikoiretail.com/"
            buildConfigField "String", "url_base", '"https://bruvana.barikoiretail.com/"'

            buildConfigField "String", "TRACE_USER", project.properties["BRU_TRACE_USER"] as String
            buildConfigField "String", "TRACE_PASS", project.properties["BRU_TRACE_PASS"] as String
            buildConfigField "String", "TRACE_API_KEY", project.properties["BRU_TRACE_API_KEY"] as String

            buildConfigField "String", "TRACE_BASE_URL", project.properties["TRACE_BASE_URL_STAGING"] as String
            buildConfigField 'String', 'sentryDNS', '"https://9b5077bb9603abdd8a1562ff914b8790@sentry.barikoimaps.dev/13"'
            manifestPlaceholders = [
                    appIcon  : "@mipmap/ic_launcher_2",
                    sentryDNS: "https://9b5077bb9603abdd8a1562ff914b8790@sentry.barikoimaps.dev/13"
            ]
        }
        staging {
            applicationId "com.barikoi.bruvanastaging"
            dimension "environment"
            versionName "1.2.7.11_1"
            resValue "string", "app_name", "Bruvana Staging SFA"
            resValue "string", "url_base", "https://bruvana.barikoimaps.dev/"
            buildConfigField "String", "url_base", '"https://bruvana.barikoimaps.dev/"'

            buildConfigField "String", "TRACE_USER", project.properties["BRU_TRACE_USER"] as String
            buildConfigField "String", "TRACE_PASS", project.properties["BRU_TRACE_PASS"] as String
            buildConfigField "String", "TRACE_API_KEY", project.properties["BRU_TRACE_API_KEY"] as String

            buildConfigField "String", "TRACE_BASE_URL", project.properties["TRACE_BASE_URL_STAGING"] as String
            buildConfigField 'String', 'sentryDNS', '"https://9b5077bb9603abdd8a1562ff914b8790@sentry.barikoimaps.dev/13"'
            manifestPlaceholders = [
                    appIcon  : "@mipmap/ic_launcher_2",
                    sentryDNS: "https://9b5077bb9603abdd8a1562ff914b8790@sentry.barikoimaps.dev/13"
            ]
        }
    }
    sourceSets {
        staging {
            java {
                srcDirs 'src\\staging\\java'
            }
        }
        production {
            java {
                srcDirs 'src\\production\\java'
            }
        }
    }
    namespace 'com.barikoi.cnlapp'
}

kapt {
    correctErrorTypes true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.compose.ui:ui-text-android:1.7.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.android.gms:play-services-places:17.1.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.android.volley:volley:1.2.1'

    /*shared prefs*/
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'

    /*roomDB*/
    implementation "androidx.room:room-runtime:2.6.1"
    //noinspection KaptUsageInsteadOfKsp
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    /*map*/
    implementation("org.maplibre.gl:android-sdk:12.0.1")
    implementation("com.github.maplibre:maplibre-navigation-android:4.0.0")

    /*progressbar*/
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    implementation 'io.sentry:sentry-android:8.17.0'

    /*image zoom*/
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    //play store update
    implementation 'com.google.android.play:app-update:2.1.0'

    /*barikoi trace-sdk*/
    implementation 'com.github.barikoi:Barikoitrace-android-sdk:0.3.0'

    // HILT
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-compiler:2.51.1"


    // Retrofit
    implementation("com.squareup.retrofit2:retrofit:2.11.0")
    implementation("com.squareup.retrofit2:converter-gson:2.11.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")

    implementation("com.onesignal:OneSignal:5.1.17")
    implementation 'com.github.esafirm:android-image-picker:3.1.0'
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.jakewharton.threetenabp:threetenabp:1.3.1'

    implementation("io.coil-kt.coil3:coil:3.0.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.0")

    implementation 'androidx.exifinterface:exifinterface:1.4.1' // or latest

    implementation("id.zelory:compressor:3.0.1")

    implementation("com.airbnb.android:lottie:6.6.9")

    implementation "com.facebook.shimmer:shimmer:0.5.0"

    implementation("com.tbuonomo:dotsindicator:5.1.0")
}