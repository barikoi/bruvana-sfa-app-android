def getDateTime() {
    return new Date().format('yyyy-MM-dd_HH-mm-ss')
}

kapt {
    correctErrorTypes true
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.compose.ui:ui-text-android:1.7.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.android.gms:play-services-places:17.1.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.android.volley:volley:1.2.1'

    /*shared prefs*/
    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'

    /*roomDB*/
    implementation "androidx.room:room-runtime:2.6.1"
    //noinspection KaptUsageInsteadOfKsp
    kapt "androidx.room:room-compiler:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"

    /*map*/
    implementation 'org.maplibre.gl:android-sdk:10.2.0'

    /*progressbar*/
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    implementation 'io.sentry:sentry-android:7.9.0'

    /*glide*/
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    kapt 'com.github.bumptech.glide:compiler:4.12.0'

    /*image zoom*/
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    //play store update
    implementation 'com.google.android.play:app-update:2.1.0'

    /*barikoi trace-sdk*/
    implementation 'com.github.barikoi:Barikoitrace-android-sdk:0.3.0'

    // HILT
    implementation "com.google.dagger:hilt-android:2.51.1"
    kapt "com.google.dagger:hilt-compiler:2.51.1"


    // Retrofit
    implementation("com.squareup.retrofit2:retrofit:2.11.0")
    implementation("com.squareup.retrofit2:converter-gson:2.11.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")

    implementation("com.onesignal:OneSignal:5.1.17")
    implementation 'com.github.esafirm:android-image-picker:3.1.0'
    implementation('io.socket:socket.io-client:2.1.0') {
        exclude group: 'org.json', module: 'json'
    }
    implementation 'com.jakewharton.threetenabp:threetenabp:1.3.1'

    implementation("io.coil-kt.coil3:coil:3.0.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.0")

    implementation("id.zelory:compressor:3.0.1")
}