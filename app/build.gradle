plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android-extensions'
    id 'kotlin-kapt'
}

android {
    compileSdk 32

    defaultConfig {
        minSdk 16
        targetSdk 32
        versionCode 1
        multiDexEnabled true
        flavorDimensions "default"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    productFlavors {
        production{
            applicationId "com.barikoi.cnlapp"
            dimension "default"
            versionName "1.0.4_22"
            resValue "string", "app_name", "CNL App"
            /*resValue "string", "url_base", "http://cnl.bkoih3.ml:7000/"*/
            resValue "string", "url_base", "http://20.24.15.52:7000/"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher"
            ]
        }
        staging{
            applicationId "com.barikoi.cnlappstaging"
            dimension "default"
            versionName "1.0.4_21_6"
            resValue "string", "app_name", "CNL Staging App"
            //resValue "string", "url_base", "http://cnl.bkoih3.ml:7040/"
            resValue "string", "url_base", "http://20.24.15.52:7040/"
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher_2"
            ]
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    //implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.google.android.material:material:1.5.0'
    //implementation "androidx.compose.material3:material3:1.7.0"

    implementation 'com.google.android.gms:play-services-places:17.0.0'
    implementation 'com.google.android.gms:play-services-location:19.0.0'

    implementation 'com.android.volley:volley:1.2.1'

    /*roomDB*/
    implementation "androidx.room:room-runtime:2.4.3"
    annotationProcessor "androidx.room:room-compiler:2.4.3"
    implementation 'androidx.lifecycle:lifecycle-livedata:2.5.1'
    kapt "androidx.room:room-compiler:2.2.4"
    kapt "androidx.room:room-runtime:2.2.4"

    /*map*/
    /*implementation 'com.graphhopper:graphhopper-navigation-android-ui:0.1.0-SNAPSHOT'
    implementation 'com.graphhopper:directions-api-client:0.10.1-4'*/
    implementation 'org.maplibre.gl:android-sdk:9.2.1'
    //implementation 'com.github.maplibre:maplibre-navigation-android:1.1.1'

    /*progressbar*/
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    implementation 'io.sentry:sentry-android:6.4.1'

    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
}